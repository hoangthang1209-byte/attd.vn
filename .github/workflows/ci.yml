name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/attd_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint changed code
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD^"
          fi

          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD --               '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed JavaScript/TypeScript files to lint."
            exit 0
          fi

          printf 'Linting changed files:\n%s\n' "${FILES[*]}"
          npx eslint "${FILES[@]}"

      - name: Typecheck
        run: npm run typecheck

      - name: Public token safety check
        run: npm run security:public-token

      - name: Tests
        run: npm test --if-present

      - name: Production build
        run: npm run build
