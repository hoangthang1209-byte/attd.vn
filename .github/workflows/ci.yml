name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: attd_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d attd_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/attd_ci?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare isolated CI schema
        run: npx prisma db push --skip-generate

      - name: Lint changed code
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
          fi

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA="HEAD^"
          fi

          mapfile -t FILES < <(
            git diff --name-only --diff-filter=ACMR "$BASE_SHA"...HEAD --               '*.js' '*.jsx' '*.ts' '*.tsx' '*.mjs' '*.cjs'
          )

          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No changed JavaScript/TypeScript files to lint."
            exit 0
          fi

          printf 'Linting changed files:\n%s\n' "${FILES[*]}"
          npx eslint "${FILES[@]}"

      - name: Typecheck
        run: npm run typecheck

      - name: Public token safety check
        run: npm run security:public-token

      - name: Orchestrator shell contract tests
        run: |
          bash -n .github/scripts/build-orchestrator-common.sh
          bash -n .github/scripts/task-status-common.sh
          for test_script in .github/scripts/build-orchestrator-*.test.sh; do
            bash "$test_script"
          done

      - name: Tests
        run: npm test --if-present

      - name: Automation platform tests
        run: npx tsx --experimental-test-module-mocks --test src/features/automation/*.test.ts

      - name: Production build
        run: npm run build
