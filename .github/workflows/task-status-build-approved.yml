name: Task Status — BUILD_APPROVED

on:
  issue_comment:
    types: [created]

permissions:
  issues: write
  contents: read

jobs:
  set-approved:
    name: Set status:approved
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate BUILD_APPROVED comment
        id: validate
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          normalized="$(printf '%s' "$COMMENT_BODY" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [ "$normalized" = "BUILD_APPROVED" ]; then
            echo "authorized=true" >> "$GITHUB_OUTPUT"
          else
            echo "authorized=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply status:approved label
        if: steps.validate.outputs.authorized == 'true'
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          source .github/scripts/task-status-common.sh
          set_issue_status_label "$ISSUE_NUMBER" "status:approved"
