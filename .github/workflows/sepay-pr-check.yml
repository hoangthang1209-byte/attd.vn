name: SePay PR Check

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    env:
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build current main schema baseline
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          git show origin/main:prisma/schema.prisma > /tmp/main-schema.prisma
          npx prisma db push --schema /tmp/main-schema.prisma --force-reset --accept-data-loss --skip-generate
      - name: Apply SePay migration on main baseline
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f prisma/migrations/20260908154000_add_bank_transactions/migration.sql
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: >-
          npx eslint
          "src/features/banking/sepay-bank-transactions.ts"
          "src/app/api/webhooks/sepay/route.ts"
          "src/app/api/bank-transactions/route.ts"
          "src/app/api/bank-transactions/[id]/reconcile/route.ts"
          "src/components/admin/banking/BankTransactionManager.tsx"
          "src/components/admin/orders/workspace/OrderWorkspacePaymentTab.tsx"
          "src/app/(backend)/admin/bank-transactions/page.tsx"
      - run: npm run build
