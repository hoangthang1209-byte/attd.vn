name: Task Status — Pull Request Events

on:
  pull_request:
    types: [opened, reopened, edited, closed]

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  update-linked-issues:
    name: Update linked issue status labels
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Transition linked issues
        env:
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          PR_ACTION: ${{ github.event.action }}
          PR_MERGED: ${{ github.event.pull_request.merged }}
          PREVIOUS_PR_BODY: ${{ github.event.changes.body && github.event.changes.body.from || '' }}
          GH_TOKEN: ${{ github.token }}
          BUILD_APPROVED_AUTHOR: ${{ github.repository_owner }}
          STALL_THRESHOLD_MINUTES: "45"
        run: |
          source .github/scripts/task-status-common.sh
          ensure_task_status_labels

          mapfile -t linked_issues < <(linked_issue_numbers_from_pr "$PULL_NUMBER")

          if [ "$PR_ACTION" = "edited" ] && [ "${#linked_issues[@]}" -eq 0 ]; then
            if [ -n "$PREVIOUS_PR_BODY" ]; then
              echo "PR #${PULL_NUMBER} body edited with no closing references; reconciling previously linked issues."
              reconcile_previously_linked_issues_from_pr_body "$PREVIOUS_PR_BODY"
            else
              echo "PR #${PULL_NUMBER} edited without body change; skipping stale reconciliation."
            fi
            exit 0
          fi

          if [ "${#linked_issues[@]}" -eq 0 ]; then
            echo "No linked issues found for PR #${PULL_NUMBER}."
            exit 0
          fi

          if [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "true" ]; then
            target_status="status:merged"
          elif [ "$PR_ACTION" = "closed" ] && [ "$PR_MERGED" = "false" ]; then
            for issue_number in "${linked_issues[@]}"; do
              echo "PR #${PULL_NUMBER} closed without merge; reconciling issue #${issue_number}."
              reconcile_issue_without_open_pr "$issue_number"
            done
            exit 0
          else
            target_status="status:pr-open"
          fi

          for issue_number in "${linked_issues[@]}"; do
            echo "Setting issue #${issue_number} to ${target_status} (PR #${PULL_NUMBER})."
            set_issue_status_label "$issue_number" "$target_status"
          done
