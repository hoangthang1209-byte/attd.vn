name: Task Status — Stalled Watchdog

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  mark-stalled:
    name: Mark stalled approved tasks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan open issues for stalled approvals
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_APPROVED_AUTHOR: ${{ github.repository_owner }}
          STALL_THRESHOLD_MINUTES: "45"
        run: |
          source .github/scripts/task-status-common.sh
          ensure_task_status_labels

          mapfile -t candidate_issues < <(list_stall_watchdog_candidate_issues)

          now_epoch="$(date -u +%s)"
          threshold_seconds=$((STALL_THRESHOLD_MINUTES * 60))

          for issue_number in "${candidate_issues[@]}"; do
            approved_at="$(latest_authorized_build_approved_timestamp "$issue_number")"
            if [ -z "$approved_at" ]; then
              continue
            fi

            if [ "$(open_linked_pull_request_count "$issue_number")" -gt 0 ]; then
              continue
            fi

            approved_epoch="$(date -u -d "$approved_at" +%s)"
            age_seconds=$((now_epoch - approved_epoch))
            if [ "$age_seconds" -lt "$threshold_seconds" ]; then
              continue
            fi

            echo "Issue #${issue_number} is stalled (${age_seconds}s since BUILD_APPROVED, no open linked PR)."
            set_issue_status_label "$issue_number" "status:stalled"

            if [ "$(issue_has_stalled_comment "$issue_number")" = "true" ]; then
              echo "Issue #${issue_number} already has TASK_STALLED comment; skipping."
              continue
            fi

            gh issue comment "$issue_number" --body "$STALLED_COMMENT"
          done
